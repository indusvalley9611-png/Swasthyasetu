<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Medical Cross / Pulse Emblem -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <circle cx="192" cy="192" r="150" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12"/>
    
    <!-- Pulse Line & Heart -->
    <path d="M 64,192 L 120,192 L 148,112 L 192,272 L 232,144 L 260,224 L 280,192 L 320,192" 
          fill="none" 
          stroke="url(#pulse)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <circle cx="192" cy="72" r="16" fill="#5eead4"/>
  </g>
</svg>